
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSLC Paper Hub</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef3ff;
color:#172554;
}

header{
background:#2563eb;
color:white;
text-align:center;
padding:25px 10px;
}

header h1{margin:0;font-size:28px;}
header p{margin:10px 0 0;}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:18px;
border-radius:16px;
margin-bottom:18px;
box-shadow:0 3px 12px #00000010;
}

h2{
text-align:center;
color:#1e40af;
}

.board-buttons,.exam-buttons,.year-buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin:15px 0;
}

button{
border:none;
border-radius:8px;
padding:12px 16px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.board{
background:#dbeafe;
color:#1e40af;
}

.exam{
background:#e0e7ff;
color:#3730a3;
}

.year{
background:#f1f5f9;
color:#334155;
}

.active{
background:#2563eb!important;
color:white!important;
}

.search{
width:100%;
padding:14px;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:16px;
margin:10px 0;
box-sizing:border-box;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#eff6ff;
padding:17px 10px;
text-align:left;
}

td{
padding:18px 10px;
border-bottom:1px solid #e2e8f0;
}

.subject{
font-size:17px;
}

.view{
background:#2563eb;
color:white;
margin-bottom:8px;
}

.download{
background:#15803d;
color:white;
}

.table-wrap{
overflow-x:auto;
}

#pdfBox{
display:none;
}

iframe{
width:100%;
height:75vh;
border:1px solid #ddd;
}

.close{
background:#dc2626;
color:white;
margin-bottom:10px;
}

footer{
text-align:center;
padding:20px;
color:#64748b;
}

@media(max-width:550px){
.container{padding:10px;}
.card{padding:13px;}
td{padding:15px 8px;}
button{padding:10px 12px;}
}
</style>
</head>

<body>

<header>
<h1>📚 SSLC Paper Hub</h1>
<p>Previous Year • Main Exam • Midterm Exam</p>
</header>

<div class="container">

<!-- BOARD SELECT -->
<div class="card">
<h2>Select Board</h2>

<div class="board-buttons">
<button id="stateBtn" class="board active"
onclick="boardSelect('state')">
Karnataka State Board
</button>

<button id="cbseBtn" class="board"
onclick="boardSelect('cbse')">
CBSE
</button>
</div>
</div>

<!-- EXAM SELECT -->
<div class="card">
<h2>Select Exam</h2>

<div class="exam-buttons">
<button id="mainBtn" class="exam active"
onclick="examSelect('main')">
Main Exam
</button>

<button id="midBtn" class="exam"
onclick="examSelect('mid')">
Midterm Exam
</button>
</div>

<h2>Previous Years</h2>

<div class="year-buttons" id="yearButtons"></div>

<input class="search" id="search"
placeholder="🔎 Search Subject..."
oninput="showTable()">
</div>

<!-- SUBJECT TABLE -->
<div class="card">
<h2 id="title">Question Papers</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Subject</th>
<th>Question Papers</th>
</tr>
</thead>
<tbody id="subjectsTable"></tbody>
</table>
</div>
</div>

<!-- PDF VIEWER -->
<div class="card" id="pdfBox">
<button class="close" onclick="closePDF()">✖ Close PDF</button>
<h2 id="pdfTitle"></h2>
<iframe id="pdfFrame"></iframe>
</div>

</div>

<footer>
© 2026 SSLC Paper Hub
</footer>

<script>

// SUBJECTS

const subjects={
state:[
"Kannada","English","Hindi",
"Mathematics","Science","Social Science"
],
cbse:[
"English","Hindi","Kannada",
"Mathematics","Science","Social Science"
]
};

// YEARS

const years=[2026,2025,2024,2023,2022,2021];

// PDF LINKS

const papers={
state:{main:{},mid:{}},
cbse:{main:{},mid:{}}
};

// CURRENT SETTINGS

let board="state";
let exam="main";
let selectedYear=2026;

// YEAR BUTTONS

function createYears(){
const box=document.getElementById("yearButtons");
box.innerHTML="";

years.forEach(y=>{
const b=document.createElement("button");
b.textContent=y;
b.className="year"+(y===selectedYear?" active":"");

b.onclick=()=>{
selectedYear=y;
createYears();
showTable();
};

box.appendChild(b);
});
}

// BOARD

function boardSelect(b){
board=b;

document.getElementById("stateBtn")
.classList.toggle("active",b==="state");

document.getElementById("cbseBtn")
.classList.toggle("active",b==="cbse");

showTable();
}

// EXAM

function examSelect(e){
exam=e;

document.getElementById("mainBtn")
.classList.toggle("active",e==="main");

document.getElementById("midBtn")
.classList.toggle("active",e==="mid");

showTable();
}

// TABLE

function showTable(){

const tbody=document.getElementById("subjectsTable");
tbody.innerHTML="";

const search=document.getElementById("search")
.value.toLowerCase();

document.getElementById("title").textContent=
(board==="state"?"Karnataka State Board":"CBSE")
+" - "+selectedYear+" - "
+(exam==="main"?"Main Exam":"Midterm Exam");

subjects[board]
.filter(s=>s.toLowerCase().includes(search))
.forEach(subject=>{

const key=selectedYear+"|"+subject;
const url=papers[board][exam][key];

const tr=document.createElement("tr");

const td1=document.createElement("td");
td1.className="subject";
td1.textContent=subject;

const td2=document.createElement("td");

const view=document.createElement("button");
view.className="view";
view.textContent="View PDF";
view.onclick=()=>viewPDF(url,subject);

const download=document.createElement("button");
download.className="download";
download.textContent="Download PDF";
download.onclick=()=>downloadPDF(url,subject);

td2.appendChild(view);
td2.appendChild(document.createElement("br"));
td2.appendChild(download);

tr.appendChild(td1);
tr.appendChild(td2);

tbody.appendChild(tr);
});

if(tbody.children.length===0){
tbody.innerHTML="<tr><td colspan='2'>No Subject Found</td></tr>";
}
}

// VIEW PDF

function viewPDF(url,subject){

if(!url){
alert("ಈ Subject PDF Link ಇನ್ನೂ ಸೇರಿಸಿಲ್ಲ.");
return;
}

document.getElementById("pdfBox").style.display="block";
document.getElementById("pdfTitle").textContent=subject+" PDF";
document.getElementById("pdfFrame").src=url;

document.getElementById("pdfBox")
.scrollIntoView({behavior:"smooth"});
}

// DOWNLOAD PDF

function downloadPDF(url,subject){

if(!url){
alert("ಈ Subject PDF Link ಇನ್ನೂ ಸೇರಿಸಿಲ್ಲ.");
return;
}

const a=document.createElement("a");
a.href=url;
a.download=subject+".pdf";
a.target="_blank";
document.body.appendChild(a);
a.click();
a.remove();
}

// CLOSE PDF

function closePDF(){
document.getElementById("pdfFrame").src="";
document.getElementById("pdfBox").style.display="none";
}

// START

createYears();
showTable();

</script>

</body>
</html>
