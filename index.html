
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSLC Paper Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3ff;
    color: #172554;
}

header {
    background: linear-gradient(135deg,#1d4ed8,#4338ca);
    color: white;
    text-align: center;
    padding: 25px 12px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 10px 0 0;
}

.container {
    max-width: 950px;
    margin: 20px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px #00000012;
    margin-bottom: 18px;
}

h2 {
    text-align: center;
    margin-top: 0;
    color: #1e40af;
}

button, select, input {
    font-size: 16px;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 9px;
    padding: 12px 18px;
    font-weight: bold;
}

.board-buttons,
.exam-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 15px 0;
}

.board-btn {
    background: #dbeafe;
    color: #1e40af;
}

.exam-btn {
    background: #e0e7ff;
    color: #3730a3;
}

.active {
    background: #2563eb !important;
    color: white !important;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 18px 0;
}

.controls input,
.controls select {
    flex: 1;
    min-width: 150px;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: white;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
}

th {
    background: #eff6ff;
    color: #1e3a8a;
    padding: 17px 12px;
    text-align: left;
}

td {
    padding: 18px 12px;
    border-bottom: 1px solid #e2e8f0;
}

.subject {
    font-weight: 500;
    font-size: 17px;
}

.action-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.view-btn {
    background: #2563eb;
    color: white;
}

.download-btn {
    background: #15803d;
    color: white;
}

.message {
    text-align: center;
    color: #64748b;
    padding: 20px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

#pdfSection {
    display: none;
}

#pdfFrame {
    width: 100%;
    height: 75vh;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
}

.close-btn {
    background: #dc2626;
    color: white;
    margin-bottom: 12px;
}

@media(max-width:600px) {
    header h1 {
        font-size: 23px;
    }

    .container {
        padding: 10px;
    }

    .card {
        padding: 14px;
    }

    td {
        padding: 14px 8px;
    }

    .action-buttons button {
        padding: 10px 12px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 SSLC Paper Hub</h1>
    <p>Previous Year • Main Exam • Midterm Exam</p>
</header>

<div class="container">

<div class="card">
    <h2>Select Board</h2>

    <div class="board-buttons">
        <button class="board-btn active" id="stateBtn"
        onclick="selectBoard('state')">
        Karnataka State Board
        </button>

        <button class="board-btn" id="cbseBtn"
        onclick="selectBoard('cbse')">
        CBSE
        </button>
    </div>

    <h2>Select Exam</h2>

    <div class="exam-buttons">
        <button class="exam-btn active" id="mainBtn"
        onclick="selectExam('main')">
        Main Exam
        </button>

        <button class="exam-btn" id="midtermBtn"
        onclick="selectExam('midterm')">
        Midterm Exam
        </button>
    </div>

    <div class="controls">
        <select id="yearSelect" onchange="renderTable()">
        </select>

        <input type="text" id="searchInput"
        placeholder="🔎 Search Subject..."
        oninput="renderTable()">
    </div>
</div>

<div class="card">
    <h2 id="tableTitle">Question Papers</h2>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th id="examHeading">Main Exam</th>
                </tr>
            </thead>
            <tbody id="paperTable"></tbody>
        </table>
    </div>
</div>

<div class="card" id="pdfSection">
    <button class="close-btn" onclick="closePDF()">✖ Close PDF</button>
    <h2 id="pdfTitle">PDF Viewer</h2>
    <iframe id="pdfFrame"></iframe>
</div>

</div>

<footer>
    © 2026 SSLC Paper Hub | Study Smart 📖
</footer>

<script>

// ================= SUBJECTS =================

const SUBJECTS = {
    state: [
        "Kannada",
        "English",
        "Hindi",
        "Mathematics",
        "Science",
        "Social Science"
    ],

    cbse: [
        "English",
        "Hindi",
        "Kannada",
        "Mathematics",
        "Science",
        "Social Science"
    ]
};

// ================= YEARS =================

const YEARS = [
    2026, 2025, 2024, 2023, 2022, 2021
];

// ================= PDF LINKS =================
// ಇಲ್ಲಿ ನಿನ್ನ ನಿಜವಾದ PDF URL ಸೇರಿಸಬೇಕು.
// Example:
// "2026|Kannada": "https://example.com/kannada.pdf"

const PAPER_LINKS = {
    state: {
        main: {},
        midterm: {}
    },

    cbse: {
        main: {},
        midterm: {}
    }
};

// ================= VARIABLES =================

let currentBoard = "state";
let currentExam = "main";

// ================= BOARD =================

function selectBoard(board) {
    currentBoard = board;

    document.getElementById("stateBtn")
    .classList.toggle("active", board === "state");

    document.getElementById("cbseBtn")
    .classList.toggle("active", board === "cbse");

    renderTable();
}

// ================= EXAM =================

function selectExam(exam) {
    currentExam = exam;

    document.getElementById("mainBtn")
    .classList.toggle("active", exam === "main");

    document.getElementById("midtermBtn")
    .classList.toggle("active", exam === "midterm");

    renderTable();
}

// ================= YEAR SELECT =================

function loadYears() {
    const select = document.getElementById("yearSelect");

    select.innerHTML = "";

    YEARS.forEach(year => {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        select.appendChild(option);
    });
}

// ================= RENDER TABLE =================

function renderTable() {
    const year = document.getElementById("yearSelect").value;
    const search = document.getElementById("searchInput")
    .value.toLowerCase();

    const subjects = SUBJECTS[currentBoard];

    const table = document.getElementById("paperTable");
    table.innerHTML = "";

    document.getElementById("tableTitle").textContent =
        (currentBoard === "state"
        ? "Karnataka State Board"
        : "CBSE") + " - " + year + " Question Papers";

    document.getElementById("examHeading").textContent =
        currentExam === "main"
        ? "Main Exam"
        : "Midterm Exam";

    subjects
    .filter(subject => subject.toLowerCase().includes(search))
    .forEach(subject => {

        const key = year + "|" + subject;

        const url = PAPER_LINKS[currentBoard][currentExam][key];

        const row = document.createElement("tr");

        const subjectCell = document.createElement("td");
        subjectCell.className = "subject";
        subjectCell.textContent = subject;

        const actionCell = document.createElement("td");
        const buttons = document.createElement("div");
        buttons.className = "action-buttons";

        const viewButton = document.createElement("button");
        viewButton.className = "view-btn";
        viewButton.textContent = "View PDF";
        viewButton.onclick = () => viewPDF(url, subject, year);

        const downloadButton = document.createElement("button");
        downloadButton.className = "download-btn";
        downloadButton.textContent = "Download PDF";
        downloadButton.onclick = () => downloadPDF(url, subject, year);

        buttons.appendChild(viewButton);
        buttons.appendChild(downloadButton);

        actionCell.appendChild(buttons);

        row.appendChild(subjectCell);
        row.appendChild(actionCell);

        table.appendChild(row);
    });

    if (table.children.length === 0) {
        table.innerHTML =
        '<tr><td colspan="2" class="message">No subjects found</td></tr>';
    }
}

// ================= VIEW PDF =================

function viewPDF(url, subject, year) {
    if (!url) {
        alert("PDF link ಇನ್ನೂ ಸೇರಿಸಿಲ್ಲ. ನಂತರ link ಸೇರಿಸಬಹುದು.");
        return;
    }

    document.getElementById("pdfSection").style.display = "block";
    document.getElementById("pdfTitle").textContent =
        subject + " - " + year + " PDF";

    document.getElementById("pdfFrame").src = url;

    document.getElementById("pdfSection")
    .scrollIntoView({ behavior: "smooth" });
}

// ================= DOWNLOAD PDF =================

function downloadPDF(url, subject, year) {
    if (!url) {
        alert("PDF link ಇನ್ನೂ ಸೇರಿಸಿಲ್ಲ. ನಂತರ link ಸೇರಿಸಬಹುದು.");
        return;
    }

    const link = document.createElement("a");
    link.href = url;
    link.download = subject + "_" + year + ".pdf";
    link.target = "_blank";

    document.body.appendChild(link);
    link.click();
    link.remove();
}

// ================= CLOSE PDF =================

function closePDF() {
    document.getElementById("pdfFrame").src = "";
    document.getElementById("pdfSection").style.display = "none";
}

// ================= START =================

loadYears();
renderTable();

</script>

</body>
</html>
